# =============================================================================
# 【HTTPS 与域名的运维说明 —— 换域名、或想开 GitHub 那个灰色开关时，请先读这段】
#
# 本站域名解析挂在 Cloudflare 上并开启了代理（橙色云）。由此产生两个容易误判的
# 现象，记录在此以免日后重复排查：
#
# 1. GitHub 仓库 Settings → Pages 的「Enforce HTTPS」是灰色、点不了，提示
#    "your domain is not properly configured to support HTTPS"。
#    原因：流量都被 Cloudflare 接走，GitHub 收不到 ACME 验证请求，无法为本域名
#    签发证书（直连 GitHub 的 185.199.108-111.153 只会拿到 *.github.io 证书，
#    不覆盖自定义域名），因此拒绝开启该选项。
#
#    【这不影响使用】实测 http 访问由 Cloudflare 返回 301 跳到 https，且只需
#    一跳即达 200，不存在重定向循环。也就是 HTTPS 强制跳转已在 Cloudflare 层
#    完成，GitHub 那个开关是多余的，保持灰色即可，不要去关代理换它。
#
# 2. Cloudflare 在「Always Use HTTPS」旁会提示：若源站也强制跳转 HTTPS，可能
#    导致 ERR_TOO_MANY_REDIRECTS。本站不会：GitHub Pages 的 Enforce HTTPS 开
#    不了，源站并不做跳转，没有第二跳。该循环只在 Cloudflare 的 SSL/TLS 模式为
#    Flexible 时才会发生——那种模式用 http 回源，与源站跳转互相推。因此请确保
#    SSL/TLS 模式为 Full 或 Full (strict)，不要用 Flexible。
#
# 换域名的操作：只改 static/CNAME 一行，再到 Cloudflare 为新子域名加一条指向
# <用户名>.github.io 的 CNAME 记录即可，本文件无需改动。
# =============================================================================
#
# 本地开发用的地址。线上构建时 GitHub Actions 会用
#   --baseURL "${{ steps.pages.outputs.base_url }}/"
# 覆盖本项，实际域名由仓库根目录的 static/CNAME 决定（GitHub Pages 读它来绑定域名）。
#
# 【刻意不在这里写真实域名】域名可能更换（免费域名有有效期），而本文件的改动会
# 进版本控制、长期留存。把它留成本地地址，换域名时只需改 static/CNAME 一行，
# 其余环节（所有 absURL、RSS、sitemap、og:url、站内绝对链接）都由 Pages 的输出
# 自动派生，不需要动任何配置。
baseURL: "http://localhost:1313/"
title: lonelysam3's Blog # 站点标题
# 页脚版权。链接用相对路径 "/" 而不是写死域名——相对路径在任何域名下都正确，
# 换域名时无需改动。改成绝对地址反而会多出一处需要同步维护的地方。
copyright: "[©2026 lonelysam3's Blog](/)"
theme: PaperMod # 主题
languageCode: zh-cn # 语言

enableInlineShortcodes: true # shortcode，类似于模板变量，可以在写 markdown 的时候便捷地插入，官方文档中有一个视频讲的很通俗
hasCJKLanguage: true # 是否有 CJK 的字符
enableRobotsTXT: true # 允许生成 robots.txt
buildDrafts: false # 构建时是否包括草稿
buildFuture: false # 构建未来发布的内容
buildExpired: false # 构建过期的内容
enableEmoji: true # 允许 emoji
pagination.pagerSize: 5 #5篇文章翻页
pygmentsUseClasses: true
defaultContentLanguage: zh # 顶部首先展示的语言界面
defaultContentLanguageInSubdir: false # 是否要在地址栏加上默认的语言代码
# 关闭自动生成的别名重定向页。启用多语言后，Hugo 会额外为默认语言生成
# public/zh/index.html 这样一个 219 字节的跳转页（把 /zh/ 重定向到 /）。
# 本站默认语言就在根路径、从没有过 /zh/ 这个地址，因此这个文件纯属多余。
disableAliases: true

#配置导航栏
languages:
  zh:
    languageName: "中文" # 展示的语言名
    weight: 1 # 权重
    # 语言代码影响 <html lang>、日期本地化、评论系统界面语言（giscus 的
    # data-lang）。必须在这里显式声明：根级的 languageCode 是站点默认值，
    # Hugo 不会把它继承到语言块，缺失时会退化成语言键 "zh"，
    # 而 giscus 需要 "zh-CN" 这样的 BCP-47 标签才能正确本地化界面。
    languageCode: zh-cn
    # 中文沿用「2025 年 11 月 1 日」这种写法。不显式声明的话，
    # 模板里的 `site.Params.DateFormat | default` 会落到英文默认值，
    # 中文站会显示成「十一月 1, 2025」这种中英混排的日期。
    params:
      DateFormat: "2006 年 1 月 2 日"
      # 列表左侧「日期戳」的短格式：只到月。日号另用 02 取两位数字，
      # 与语言无关，因此这里只需管年与月。
      DateFormatMonth: "2006 年 1 月"
      # 「在 GitHub 上编辑」的文案必须写在【语言级】。
      # 写在根级 params 里两种语言会共用同一份，英文站因此一直显示中文。
      # 三字段要写全：Hugo 对语言级与根级 params 是浅合并，
      # 语言里出现 editPost 就整表替换，只写 Text 会让 URL 丢失、链接失效。
      editPost:
        URL: "https://github.com/lonelysam3/lonelysam3.github.io/blob/main/content"
        Text: "在 GitHub 上编辑"
        appendFilePath: true
    taxonomies: # 分类系统
      category: categories
      tag: tags
    # https://gohugo.io/content-management/menus/#define-in-site-configuration
    menus:
      main:
        - name: 首页
          pageRef: /
          weight: 1 # 控制在页面上展示的前后顺序
       # - name: 文章
       #   pageRef: posts/
       #   weight: 2
        - name: 归档
          pageRef: archives/
          weight: 5
        # 「分类」与「标签」合并为「浏览」一项：两者原本各占一个导航位置，
        # 但都是索引类页面，读者想知道「站里有什么」时要在两者间来回跳。
        # 浏览页（layouts/_default/browse.html）把分类、标签、全部文章并排
        # 呈现，并说明两者语义差异。
        # 原有的 /categories/ 与 /tags/ 页面【保留可用】——它们是 Hugo 的
        # taxonomy 页面，大量文章与搜索结果的链接指向它们，删掉会让链接失效。
        # 这里只是不再从主导航露出入口，避免重复。
        - name: 浏览
          pageRef: browse/
          weight: 10
        - name: 统计
          pageRef: stats/
          weight: 15
        - name: 关于
          pageRef: about/
          weight: 21
  en:
    languageName: "English"
    weight: 2
    # 显式声明内容目录。Hugo 默认对语言 en 取 content/en，
    # 但本站默认语言是 zh 且 defaultContentLanguageInSubdir: false——
    # 实测在这种组合下，content/en/ 里的【普通页面】会被当作中文站的内容渲染
    # （.Language.Lang 返回 zh、i18n 取中文），只有 _index.md 能被正确识别；
    # 显式写 contentDir 后语言归属就明确了。
    contentDir: content/en
    # 语言代码影响 <html lang>、日期本地化与 screen reader 发音
    languageCode: en-us
    # 英文界面不做 CJK 断行处理
    hasCJKLanguage: false
    title: "lonelysam3's Blog"
    taxonomies:
      category: categories
      tag: tags
    params:
      title: "lonelysam3's Blog"
      description: "Notes on web security, Linux, and whatever else I break."
      # 必须在此重复声明：根级 params.mainSections 不会自动继承到语言级，
      # 缺了它英文站的 where 查询会得到空列表——表现为浏览页「共 0 篇文章」、
      # 统计页所有数字为 0、侧栏「最新文章」为空。
      mainSections: ["posts"]
      # 首页简介区的文案。home_info.html 读的是 site.Params.homeInfoParams，
      # 在英文站会解析到这一份。
      homeInfoParams:
        Title: "lonelysam3's Blog"
        Content: "Notes on web security, Linux, and whatever else I break."
      # 日期用美式写法（Mar 17, 2026），与中文的「三月 17, 2026」区分开
      # ——这是「看起来像美国人博客」的一部分，不只是翻译文字。
      DateFormat: "Jan 2, 2006"
      # 列表左侧日期戳的短格式（月 + 年）
      DateFormatMonth: "Jan 2006"
      editPost:
        URL: "https://github.com/lonelysam3/lonelysam3.github.io/blob/main/content"
        Text: "Edit on GitHub"
        appendFilePath: true
    menus:
      main:
        - name: Home
          pageRef: /
          weight: 1
        - name: Archive
          pageRef: archives/
          weight: 5
        - name: Browse
          pageRef: browse/
          weight: 10
        - name: Stats
          pageRef: stats/
          weight: 15
        - name: About
          pageRef: about/
          weight: 21
params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: "lonelysam3's Blog"
  description: "lonelysam3's personal blog."
  keywords: [Blog, Portfolio, PaperMod]
  author: Me
  # 显式声明文章所在的内容目录。
  # 主题与本站模板都大量使用 site.Params.mainSections 来筛选「文章」，
  # 例如首页列表、归档时间轴、侧栏最近文章、上下篇导航。
  # 此前未配置：Hugo 在 mainSections 为空时 where 会退化为「不过滤」，
  # 于是 about / stats 这类单页也会被当作文章列出来。
  # 主题的 post_nav_links.html 有 default (slice "posts") 兜底，但本站
  # 模板没有，因此必须在配置里显式指定。
  mainSections: ["posts"]
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  # 默认主题
  defaultTheme: auto # dark, light
  # 是否禁用主题切换按钮
  disableThemeToggle: false
  # 主题跟随时间（本轮新增）
  # ---------------------------------------------------------------------------
  # 没有手动切换过主题时，按当地时间自动选深浅色：入夜转深色，早上转浅色。
  # 一旦读者点过右上角的切换按钮，localStorage 会写入 pref-theme，
  # 此后不再自动改变——手动选择永远优先。
  #
  # 为什么不干脆跟随系统（defaultTheme: auto）：本站主要阅读时段在晚上，
  # 而很多人的系统是全天浅色。按时间切换更贴合实际场景，也不依赖系统设置。
  #
  # 不想要就把 enabled 改成 false。
  themeFollowTime:
    enabled: true
    darkFrom: 18   # 18:00 起深色
    darkUntil: 7   # 次日 7:00 前仍是深色

  # 是否启用阅读时间展示
  ShowReadingTime: true
  # 是都启用分享按钮
  ShowShareButtons: true
  # 文章底部的上/下篇：关闭。右侧边栏已有一份（见 layouts/partials/sidebar.html
  # 的「上下篇」区块），两处并存会让读者在同一页看到重复的一对链接。
  # 侧栏那份是粘性的，长文任意位置都能点到，故保留侧栏、去掉页脚这份。
  ShowPostNavLinks: false
  # 是否启用面包屑导航
  ShowBreadCrumbs: true
  # 是否显示代码复制按钮
  ShowCodeCopyButtons: true
  # 是否显示字数统计
  ShowWordCount: true
  # 是否在页面显示 RSS 按钮
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  # 是否禁用首页滚动到顶部
  disableScrollToTop: false
  # 是否启用评论系统
  comments: true
  # 是否隐藏 Meta 信息
  hidemeta: false
  # 是否隐藏文章摘要
  hideSummary: false
  # 是否显示目录
  showtoc: false
  # 是否默认展开文章目录
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true

    # 网站 Favicon 图标相关信息
    # 可在 https://realfavicongenerator.net/ 生成多尺寸版本后放入 /static
    # 说明：原先五个字段都指向 static/feather.png，但该文件并不存在，
    # 实测线上 /feather.png 返回 404，浏览器标签页图标始终是空白。
    # 这里统一改指向确实存在的 r-c.jpg（1080x1080 正方形，可缩放）。
    # 若要更规整，建议自行生成 favicon.ico / 32x32 / 180x180 后替换下列值。
    favicon: "r-c.jpg"
    favicon16x16: "r-c.jpg"
    favicon32x32: "r-c.jpg"
    apple_touch_icon: "r-c.jpg"
    safari_pinned_tab: "r-c.jpg"
    disableHLJS: true # to disable highlight.js

  label:
    # 使用文本替代 Logo 标签
    text: lonelysam3's Blog
    # 网站 Logo 图片（/static 下面的文件名称）
    icon: "r-c.jpg"
    # 图标高度
    iconHeight: 48

  # 主页展示模式
  # 个人信息模式
  profileMode:
    enabled: false # needs to be explicitly set
    title: Welcome to my Blog
    subtitle: ""
    imageUrl: "blog.jpg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    #buttons:
    #  - name: 文章
    #    url: posts/
    #  - name: bilibili
    #    url: X

  # 主页 - 信息模式（默认）
  homeInfoParams:
    Title: "lonelysam3 的博客"
    Content: "一些记录，关于网络安全、Linux以及学校里的各种事"
  #  主页 - 信息模式 图标展示
  socialIcons:
    - name: x
      url: "https://x.com/LonelySam8L"
    - name: stackoverflow
      url: "https://stackoverflow.com"
    - name: github
      url: "https://github.com/lonelysam3"

  analytics:
    # 说明：以下三处原为站点模板自带的占位值 "XYZabc"，
    # 始终渲染成假的验证 meta 标签。未实际使用该服务，予以清空。
    # 将来接入时填入真实验证串即可恢复。
    google:
      SiteVerificationTag: ""
    bing:
      SiteVerificationTag: ""
    yandex:
      SiteVerificationTag: ""

  # 文章封面设置
  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page
  # 关联编辑：此处 URL 原先残留占位符 <path_to_repo>，
  # 导致每篇文章的 “Suggest Changes” 都指向一个 404 链接（实测生成
  # https://github.com/%3cpath_to_repo%3e/... ）。已改为真实仓库地址。

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
    includeMatches: true
  giscus:
    repo: "lonelysam3/lonelysam3.github.io"
    repoId: "R_kgDOQNPZNg"
    category: "Announcements"
    categoryId: "DIC_kwDOQNPZNs4CxVAR"
    mapping: "pathname"
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    lightTheme: "light"
    darkTheme: "dark"
    # 【必须逐字写成 giscus 自己的语言标签，不能用 BCP-47】
    # giscus 的 widget 路径对语言段大小写敏感，只认它自己定义的那几个值：
    #   /zh-CN/widget → 200    /zh-cn/widget → 404
    #   /en/widget    → 200    /en-US/widget → 404
    # 而本站语言代码是标准 BCP-47（zh-cn / en-us），写法与它不同，所以在这里
    # 显式写明，不由模板从 site.Language.LanguageCode 推导。
    # （曾经推导过一次：得到小写 zh-cn，widget 直接 404，整块评论区被浏览器
    #   以 CSP 拦掉。原因已记在 comments.html 里，避免重犯。）
    lang: "zh-CN"
    # 按语言覆盖：键是站点语言代码，值是 giscus 认可的语言标签。
    # 英文站要用 "en"，不能用 BCP-47 的 en-us。
    langByLanguage:
      zh: "zh-CN"
      en: "en"
    crossorigin: "anonymous"
#pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true # 可以 unsafe，有些 html 标签和样式可能需要
  highlight:
    anchorLineNos: false # 不要给行号设置锚标
    codeFences: true # 代码围栏
    noClasses: false # TODO: 不知道干啥的，暂时没必要了解，不影响展示
    lineNos: true # 代码行
    lineNumbersInTable: false # 不要设置成 true，否则如果文章开头是代码的话，摘要会由一大堆数字(即代码行号)开头文章
    # 这里设置 style 没用，得自己加 css
    # style: "github-dark"
    # style: monokai
# https://github.com/adityatelange/hugo-PaperMod/wiki/Features#search-page
outputs:
  home:
    - HTML # 生成的静态页面
    - RSS # 这个其实无所谓
    - JSON # necessary for search, 这里的配置修改好之后，一定要重新生成一下
