# ============================================================================
# i18n/en.yaml — English UI strings
# ----------------------------------------------------------------------------
# Mirrors i18n/zh.yaml key for key. Theme-provided keys (read_time / words /
# prev_page / next_page / toc / translations / home / edit_post / code_copy /
# code_copied) come from themes/PaperMod/i18n/en.yaml and are intentionally
# not duplicated here.
#
# Wording is deliberately idiomatic rather than literal: the goal is that an
# English reader sees a site written for them, not a translation of a Chinese
# one. Hence "Older / Newer" instead of "Previous / Next", "Reading time"
# instead of "Total reading minutes", and so on.
# ============================================================================

