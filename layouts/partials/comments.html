 <div id="tw-comment"></div>
 <script>
     // 默认是暗色，根目录下的配置中的主题默认也是暗色
     const getStoredTheme = () => localStorage.getItem("pref-theme") === "light" ? "{{ .Site.Params.giscus.lightTheme }}" : "{{ .Site.Params.giscus.darkTheme }}";
     const setGiscusTheme = () => {
         const sendMessage = (message) => {
             const iframe = document.querySelector('iframe.giscus-frame');
             if (iframe) {
                 iframe.contentWindow.postMessage({giscus: message}, 'https://giscus.app');
            }
        }
        sendMessage({setConfig: {theme: getStoredTheme()}})
    }

    document.addEventListener("DOMContentLoaded", () => {
        const giscusAttributes = {
            "src": "https://giscus.app/client.js",
            "data-repo": "{{ .Site.Params.giscus.repo }}",
            "data-repo-id": "{{ .Site.Params.giscus.repoId }}",
            "data-category": "{{ .Site.Params.giscus.category }}",
            "data-category-id": "{{ .Site.Params.giscus.categoryId }}",
            "data-mapping": "{{ .Site.Params.giscus.mapping }}",
            "data-strict": "{{ .Site.Params.giscus.strict }}",
            "data-reactions-enabled": "{{ .Site.Params.giscus.reactionsEnabled }}",
            "data-emit-metadata": "{{ .Site.Params.giscus.emitMetadata }}",
            "data-input-position": "{{ .Site.Params.giscus.inputPosition }}",
            "data-theme": getStoredTheme(),
            {{- /* 【giscus 的语言标签不能从站点语言代码推导】
                   giscus 的 widget 路径对语言段大小写敏感，且只认它自己定义的
                   那几个标签：
                     /zh-CN/widget → 200      /zh-cn/widget → 404
                     /en/widget    → 200      /en-US/widget → 404
                   而本站语言代码是标准 BCP-47（zh-cn、en-us），两者写法不同。
                   曾经用 site.Language.LanguageCode 推导，得到小写 "zh-cn"，
                   widget 返回 404，而 404 响应带 `frame-ancestors 'self'`，
                   于是整个评论区被浏览器以 CSP 拦掉（iframe 里只剩一个破图）。

                   因此改为从配置读取，按语言取值：site.Params.giscus.langByLanguage，
                   键为站点语言代码，值为 giscus 认可的标签。取不到再退回 lang。 */}}
            "data-lang": "{{ index .Site.Params.giscus.langByLanguage .Site.Language.Lang | default .Site.Params.giscus.lang }}",
            "data-loading": "lazy",
            "crossorigin": "anonymous",
        };

        // 动态创建 giscus script
        const giscusScript = document.createElement("script");
        Object.entries(giscusAttributes).forEach(
                ([key, value]) => giscusScript.setAttribute(key, value));
        document.querySelector("#tw-comment").appendChild(giscusScript);

        // 页面主题变更后，变更 giscus 主题
        const themeSwitcher = document.querySelector("#theme-toggle");
        if (themeSwitcher) {
            themeSwitcher.addEventListener("click", setGiscusTheme);
        }
        const themeFloatSwitcher = document.querySelector("#theme-toggle-float");
        if (themeFloatSwitcher) {
            themeFloatSwitcher.addEventListener("click", setGiscusTheme);
        }
    });
</script>
